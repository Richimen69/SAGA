version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mi_base_datos
      POSTGRES_USER: usuario_db
      POSTGRES_PASSWORD: password_seguro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=1
      - DB_NAME=bcbd
      - DB_USER=saga
      - DB_PASSWORD=634992482
      - DB_HOST=193.203.164.202
      - DB_PORT=5432
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: